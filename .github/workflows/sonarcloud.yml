name: SonarQube Cloud

on:
  push:
    branches:
      - main

  # Allows manual reruns from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # Same ACTS environment used by upstream CI
    container:
      image: ghcr.io/acts-project/ubuntu2604:90

    steps:
      # ------------------------------------------------------------
      # 1. Basic runner setup
      # ------------------------------------------------------------
      - name: Install required packages
        run: |
          apt-get update
          apt-get install -y unzip

      # ------------------------------------------------------------
      # 2. Checkout repository
      #
      # Pinned to actions/checkout v7.0.1 using its full commit SHA.
      # fetch-depth: 0 gives Sonar full Git history.
      # persist-credentials: false avoids leaving credentials in git.
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------
      # 3. Install ACTS dependencies
      #
      # This is a local action from the checked-out ACTS repository,
      # so no external SHA is required here.
      # ------------------------------------------------------------
      - name: Install ACTS dependencies
        uses: ./.github/actions/dependencies
        with:
          compiler: g++
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          env_file: .env

      # ------------------------------------------------------------
      # 4. Configure ACTS coverage build
      # ------------------------------------------------------------
      - name: Configure ACTS
        run: |
          CI/dependencies/run.sh .env \
            cmake -B build -S . --preset=github-ci-coverage

          echo "Checking compilation database..."
          test -f build/compile_commands.json
          ls -lh build/compile_commands.json

      # ------------------------------------------------------------
      # 5. Build coverage-instrumented ACTS code
      #
      # Limit parallelism to reduce memory pressure on the
      # GitHub-hosted runner.
      # ------------------------------------------------------------
      - name: Build ACTS
        run: |
          cmake --build build -j2

      # ------------------------------------------------------------
      # 6. Run ACTS unit tests
      #
      # Running the instrumented code generates the .gcda data
      # needed to calculate real test coverage.
      # ------------------------------------------------------------
      - name: Run unit tests
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
          ACTS_LOG_FAILURE_THRESHOLD: WARNING
        run: |
          CI/dependencies/run.sh .env \
            ctest --test-dir build -j2 --label-exclude "slow"

      # ------------------------------------------------------------
      # 7. Install pinned coverage-report dependencies
      #
      # ACTS's CI/test_coverage.py contains inline Python
      # dependencies, some of which are unpinned. Running it using
      # "uv run" caused Sonar githubactions:S8544.
      #
      # Instead create an isolated environment and pin all direct
      # dependencies explicitly.
      # ------------------------------------------------------------
      - name: Install coverage report dependencies
        run: |
          uv venv .coverage-venv --python 3.14

          uv pip install \
            --python .coverage-venv/bin/python \
            gcovr==8.6 \
            lxml==6.1.3 \
            rich==15.0.0 \
            typer==0.27.2

          echo "Coverage environment:"
          .coverage-venv/bin/python --version
          .coverage-venv/bin/gcovr --version

      # ------------------------------------------------------------
      # 8. Generate SonarQube coverage XML
      #
      # Run the ACTS coverage script directly using the environment
      # above. This still produces:
      #
      #   build/coverage/cov.xml
      #   build/coverage/html/
      #
      # The --filter option removes tests, examples, Python,
      # documentation, Detray, Traccc, third-party code, etc.
      # according to ACTS's own coverage configuration.
      # ------------------------------------------------------------
      - name: Generate coverage report
        run: |
          .coverage-venv/bin/python \
            CI/test_coverage.py build --filter

          echo "Checking generated coverage report..."
          test -f build/coverage/cov.xml

          echo "Coverage XML:"
          ls -lh build/coverage/cov.xml

          echo "Coverage HTML:"
          ls -lh build/coverage/html || true

      # ------------------------------------------------------------
      # 9. Save raw coverage evidence
      #
      # Pinned to actions/upload-artifact v7.0.1 using its full SHA.
      # ------------------------------------------------------------
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-coverage-evidence
          path: |
            build/coverage/cov.xml
            build/coverage/html
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 10. Run SonarQube Cloud analysis
      #
      # Pinned to SonarSource/sonarqube-scan-action v8.2.1 using
      # the full immutable commit SHA.
      # ------------------------------------------------------------
      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=build/compile_commands.json
            --define sonar.coverageReportPaths=build/coverage/cov.xml
            --define sonar.verbose=true