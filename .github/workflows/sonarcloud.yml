name: SonarQube Cloud

on:
  push:
    branches:
      - main

  # Lets you manually rerun it from Actions without making a dummy commit
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest

    # Same ACTS environment used by the upstream CI
    container:
      image: ghcr.io/acts-project/ubuntu2604:90

    steps:
      - name: Install required packages
        run: |
          apt-get update
          apt-get install -y unzip

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ACTS dependencies
        uses: ./.github/actions/dependencies
        with:
          compiler: g++
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          env_file: .env

      - name: Configure ACTS
        run: |
          CI/dependencies/run.sh .env \
            cmake -B build -S . --preset=github-ci-coverage

          echo "Checking compilation database..."
          test -f build/compile_commands.json
          ls -lh build/compile_commands.json

      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=build/compile_commands.json
            --define sonar.verbose=true